<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GrokGrid ad</title>
<style>
@font-face { font-family: 'Geist'; src: url('../assets/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Geist Mono'; src: url('../assets/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; }
:root {
  --ink: #0a0a0a; --raised: #141414; --card: #1a1a1a; --paper: #fff;
  --hair: rgba(255,255,255,.1); --hair2: rgba(255,255,255,.2);
  --gain: #4ade80; --loss: #f87171;
  --orange: #ff6a00; --amber: #ff9a00; --teal: #13b8a6; --violet: #9b5cff; --blue: #1683ff; --pink: #ff2e9a; --grey: #7a7a7a; --brown: #9a6a3f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ink); overflow: hidden; }
#stage { position: relative; overflow: hidden; background: var(--ink); color: var(--paper); font-family: 'Geist', sans-serif; letter-spacing: -0.02em; }
.layer { position: absolute; inset: 0; }
.abs { position: absolute; }
.scene { position: absolute; inset: 0; display: none; }
.bg-grid { position: absolute; inset: -10%; background-image:
  linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size: 64px 64px; }
.bg-glow { position: absolute; inset: 0; background: radial-gradient(60% 55% at 50% 52%, rgba(255,255,255,.07), transparent 70%); }
.bg-vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.75)); }
.grain { position: absolute; inset: 0; opacity: .05; mix-blend-mode: screen; }

.h1 { font-weight: 600; line-height: 1.02; letter-spacing: -0.045em; white-space: nowrap; }
.sub { font-weight: 400; color: rgba(255,255,255,.62); letter-spacing: -0.015em; white-space: nowrap; }
.mono { font-family: 'Geist Mono', monospace; letter-spacing: 0; }
.w { display: inline-block; will-change: transform, opacity, filter; }
.dim { color: rgba(255,255,255,.38); }
.hl-teal { color: var(--teal); } .hl-orange { color: var(--orange); } .hl-gain { color: var(--gain); } .hl-violet { color: var(--violet); } .hl-blue { color: var(--blue); } .hl-pink { color: var(--pink); }

.clip { position: absolute; display: block; pointer-events: none; }
/* the real mouse drives the redrawn UI's hover states, so nothing drawn on top may catch it */
.cursor, .ripple, .h1, .sub, .w, .bubble, .chip, .call, .tag, .coin, .split, .flame, .cta, .url-pill, .mark, .marks { pointer-events: none; }

.window { position: absolute; border-radius: 20px; overflow: hidden; background: #0d0d0d; border: 1px solid var(--hair2);
  box-shadow: 0 40px 120px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.6); transform-origin: 50% 60%; }
.window .bar { height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 16px; background: #151515; border-bottom: 1px solid var(--hair); }
.window .dot { width: 12px; height: 12px; border-radius: 50%; background: #333; }
.window .dot:nth-child(1) { background: #ff5f57; } .window .dot:nth-child(2) { background: #febc2e; } .window .dot:nth-child(3) { background: #28c840; }
.window .url { margin-left: 18px; flex: 1; max-width: 420px; height: 26px; border-radius: 999px; background: #0c0c0c; border: 1px solid var(--hair);
  font: 500 13px 'Geist Mono', monospace; color: rgba(255,255,255,.7); display: flex; align-items: center; padding: 0 12px; gap: 8px; }
.window .shot { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; overflow: hidden; }
.phonecard { border-radius: 64px; border: 12px solid #1c1c1e; background: #000; box-shadow: 0 40px 120px rgba(0,0,0,.75), 0 0 0 2px #2c2c2e; }
.phonecard .shot { top: 0; }
.window .shot img { position: absolute; left: 0; top: 0; width: 100%; transform-origin: 0 0; }

.bubble { position: absolute; background: #fff; color: #0a0a0a; border-radius: 999px; padding: 14px 24px; font-weight: 600; font-size: 28px; letter-spacing: -0.02em;
  box-shadow: 0 12px 40px rgba(0,0,0,.45); white-space: nowrap; transform-origin: 0% 100%; }
.bubble::after { content: ''; position: absolute; left: 22px; bottom: -8px; width: 18px; height: 18px; background: #fff; border-radius: 3px; transform: rotate(45deg); }

.chip { position: absolute; display: flex; align-items: center; gap: 14px; padding: 14px 22px 14px 14px; border-radius: 18px; background: rgba(20,20,20,.92);
  border: 1px solid var(--hair2); box-shadow: 0 18px 50px rgba(0,0,0,.55); white-space: nowrap; transform-origin: 0% 50%; backdrop-filter: blur(8px); }
.chip .ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font: 700 15px 'Geist Mono'; }
.chip .t1 { font: 600 24px 'Geist'; letter-spacing: -0.02em; }
.chip .t2 { font: 500 16px 'Geist Mono'; color: rgba(255,255,255,.55); margin-top: 3px; }
.tag { font: 600 14px 'Geist Mono'; padding: 5px 10px; border-radius: 8px; }
.tag.buy { background: rgba(74,222,128,.14); color: var(--gain); } .tag.sell { background: rgba(248,113,113,.16); color: var(--loss); }

.call { position: absolute; width: 560px; border-radius: 22px; background: #141414; border: 1px solid var(--hair2); padding: 22px 24px; box-shadow: 0 30px 90px rgba(0,0,0,.7); transform-origin: 30% 100%; }
.call .top { display: flex; align-items: center; gap: 12px; font: 600 20px 'Geist'; }
.call .top .ago { font: 500 16px 'Geist Mono'; color: rgba(255,255,255,.45); }
.call .top .tag { margin-left: auto; }
.call .body { margin-top: 14px; font: 400 26px 'Geist'; color: rgba(255,255,255,.9); letter-spacing: -0.02em; line-height: 1.25; }
.call .row { margin-top: 18px; display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: #0e0e0e; border: 1px solid var(--hair); font: 500 17px 'Geist Mono'; color: rgba(255,255,255,.7); }

.cursor { position: absolute; width: 34px; height: 40px; z-index: 50; transform-origin: 3px 3px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.6)); }
.ripple { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); z-index: 49; }

.split { position: absolute; }
.split .bar { position: relative; height: 96px; border-radius: 26px; overflow: hidden; background: #151515; border: 1px solid var(--hair2); display: flex; }
.split .seg { height: 100%; display: flex; align-items: center; padding: 0 28px; font: 600 34px 'Geist'; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; }
.split .seg.a { background: #fff; color: #0a0a0a; }
.split .seg.b { background: var(--orange); color: #0a0a0a; }
.split .lab { position: absolute; font: 500 30px 'Geist'; color: rgba(255,255,255,.75); white-space: nowrap; letter-spacing: -0.02em; }
.coin { position: absolute; display: flex; align-items: center; gap: 14px; padding: 12px 24px 12px 12px; border-radius: 999px; background: #161616; border: 1px solid var(--hair2); font: 600 26px 'Geist'; white-space: nowrap; }
.flame { position: absolute; }

.marks { position: absolute; }
.mark { position: absolute; }
.cta { position: absolute; display: flex; align-items: center; gap: 16px; padding: 20px 40px; border-radius: 999px; background: #fff; color: #0a0a0a; font: 600 34px 'Geist'; letter-spacing: -0.03em; white-space: nowrap; }
.url-pill { position: absolute; padding: 12px 26px; border-radius: 999px; border: 1px solid var(--hair2); background: #121212; font: 500 24px 'Geist Mono'; color: rgba(255,255,255,.8); white-space: nowrap; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 90; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="ui.js"></script>
<script src="core.js"></script>
<script>document.write(`<script src="cuts/${new URLSearchParams(location.search).get('cut') || 'main'}.js"><\/script><script src="end.js"><\/script>`)</script>
</body>
</html>
